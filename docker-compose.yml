services:
  db:
    image: postgres:16-alpine
    container_name: timeline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: timeline
      POSTGRES_PASSWORD: timeline_pwd
      POSTGRES_DB: timeline_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeline -d timeline_studio"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - timeline-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: timeline-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://timeline:timeline_pwd@db:5432/timeline_studio?schema=public"
      JWT_SECRET: "yunxi-timeline-prod-secret"
      PORT: "3001"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
    ports:
      - "3001:3001"
    networks:
      - timeline-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: timeline-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - timeline-net

volumes:
  pgdata:

networks:
  timeline-net:
    driver: bridge
